# AWS Amplify custom response headers.
#
# Fingerprinted build output (everything under /assets/, content-hashed by Vite)
# can be cached forever. But the non-fingerprinted files — the app shell, the
# service worker, the web manifest, and the PWA/home-screen icons — keep stable
# filenames across deploys, so a long CDN/browser cache pins the OLD copy even
# after a new build ships. That is exactly what made the updated app icon fail to
# appear after it was deployed. Force these to revalidate on every request so a
# new deploy is picked up immediately.
customHeaders:
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/favicon.ico'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/apple-touch-icon.png'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/icon-192.png'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/icon-512.png'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/og-cover.png'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
